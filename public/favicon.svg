<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14b8a6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#14b8a6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#grad1)" filter="url(#shadow)"/>

  <!-- Inner Circle -->
  <circle cx="256" cy="256" r="200" fill="white"/>

  <!-- 선 (先/善) Character stylized as book + heart -->
  <!-- Book base -->
  <path d="M150 180 L150 360 Q150 380 170 380 L342 380 Q362 380 362 360 L362 180 Q362 160 342 160 L170 160 Q150 160 150 180Z"
        fill="url(#grad2)" opacity="0.9"/>

  <!-- Book spine -->
  <rect x="150" y="160" width="30" height="220" rx="5" fill="#0f766e"/>

  <!-- Book pages lines -->
  <line x1="200" y1="200" x2="340" y2="200" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="200" y1="240" x2="320" y2="240" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="200" y1="280" x2="330" y2="280" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

  <!-- Heart on book (representing 선한 영향력) -->
  <path d="M256 310
           C256 310 220 280 220 255
           C220 235 235 220 256 235
           C277 220 292 235 292 255
           C292 280 256 310 256 310Z"
        fill="#f97316"/>

  <!-- Sparkle/Star (representing 선행 - going ahead) -->
  <g transform="translate(340, 140)">
    <path d="M0 -25 L6 -8 L25 -8 L10 4 L16 22 L0 12 L-16 22 L-10 4 L-25 -8 L-6 -8 Z"
          fill="#a855f7"/>
  </g>

  <!-- Small sparkles -->
  <circle cx="140" cy="130" r="8" fill="#14b8a6" opacity="0.7"/>
  <circle cx="380" cy="380" r="6" fill="#f97316" opacity="0.7"/>
  <circle cx="120" cy="300" r="5" fill="#a855f7" opacity="0.7"/>
</svg>
